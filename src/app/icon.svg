<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181c24" />
      <stop offset="100%" stop-color="#0a0e16" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4edea3" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c0c1ff" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4edea3" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Fundo escuro estilizado com cantos arredondados -->
  <rect width="100" height="100" rx="24" fill="url(#bgGrad)" stroke="#4edea3" stroke-width="2" stroke-opacity="0.3" />

  <!-- Asas Biomecânicas -->
  <path
    d="M18 36 C28 22, 42 18, 50 26 C58 18, 72 22, 82 36 C74 44, 64 48, 50 42 C36 48, 26 44, 18 36 Z"
    fill="url(#indigoGrad)"
    opacity="0.85"
  />

  <!-- Raio Elétrico Central de Força & IA -->
  <path
    d="M54 16 L34 50 L48 50 L44 84 L68 46 L52 46 Z"
    fill="url(#emeraldGrad)"
    filter="url(#glow)"
  />

  <!-- Ponto de Pulso Central -->
  <circle cx="50" cy="48" r="3.5" fill="#ffffff" />
</svg>

